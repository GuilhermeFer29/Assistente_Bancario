# =================================================================
# Assistente Bancário V2 — Stack Docker
#
# Rede:
#   - gateway, mailpit, streamlit  →  bridge (bancario-v2-net)
#   - bot                          →  host (resolve DNS de generativelanguage.googleapis.com
#                                        sem depender do resolver embutido do Docker, que
#                                        falha em ambientes com systemd-resolved)
#
# Tudo lê o ../.env. Sem variáveis hardcoded fora dos defaults seguros.
#
# URLs (host):
#   Streamlit  http://localhost:${STREAMLIT_PORT:-8501}
#   Bot docs   http://localhost:${BOT_PORT:-8000}/docs
#   Gateway    http://localhost:${GATEWAY_PORT:-8001}/docs
#   Mailpit    http://localhost:${MAILPIT_UI_PORT:-8025}
# =================================================================

x-env: &env_padrao
  env_file:
    - ../.env

services:

  gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.gateway
    image: assistente-v2-gateway:latest
    container_name: assistente-v2-gateway
    <<: *env_padrao
    environment:
      PORT: ${GATEWAY_PORT:-8001}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina INTERNAL_API_TOKEN no .env}
    ports:
      - "${GATEWAY_PORT:-8001}:${GATEWAY_PORT:-8001}"
    volumes:
      - gateway_data:/app/data
    networks:
      - bancario_v2_net
    dns:
      - ${DOCKER_DNS_PRIMARY:-8.8.8.8}
      - ${DOCKER_DNS_SECONDARY:-1.1.1.1}
    depends_on:
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${GATEWAY_PORT:-8001}/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: infra/Dockerfile.bot
    image: assistente-v2-bot:latest
    container_name: assistente-v2-bot
    <<: *env_padrao
    environment:
      PORT: ${BOT_PORT:-8000}
      # No host network: gateway alcançado via localhost (port forwarding do compose)
      GATEWAY_TRANSPORT: ${GATEWAY_TRANSPORT_DOCKER:-http}
      GATEWAY_URL: http://localhost:${GATEWAY_PORT:-8001}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina INTERNAL_API_TOKEN no .env}
    network_mode: host
    volumes:
      - bot_data:/app/data
    depends_on:
      gateway:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${BOT_PORT:-8000}/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  streamlit:
    build:
      context: ..
      dockerfile: infra/Dockerfile.streamlit
    image: assistente-v2-streamlit:latest
    container_name: assistente-v2-streamlit
    <<: *env_padrao
    environment:
      PORT: ${STREAMLIT_PORT:-8501}
      # Bot está em host network → alcançável via host-gateway
      BOT_WS_URL: ws://host.docker.internal:${BOT_PORT:-8000}/chat/ws
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL_HOST:-http://localhost:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${STREAMLIT_PORT:-8501}:${STREAMLIT_PORT:-8501}"
    networks:
      - bancario_v2_net
    depends_on:
      bot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${STREAMLIT_PORT:-8501}/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: assistente-v2-mailpit
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-500}
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - bancario_v2_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  bancario_v2_net:
    name: bancario-v2-net
    driver: bridge

volumes:
  gateway_data:
    name: assistente-v2-gateway-data
  bot_data:
    name: assistente-v2-bot-data
