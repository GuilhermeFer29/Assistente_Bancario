[pytest]
asyncio_mode = auto
testpaths =
    assistente_bancario_v2/bot_service/app/tests
    assistente_bancario_v2/banking_gateway/app/tests
    tests
norecursedirs = __pycache__ .git data .venv
addopts = -ra --strict-markers
markers =
    integration: marca testes de integração (gateway/bot)
    e2e: marca testes end-to-end
