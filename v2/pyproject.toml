[project]
name = "assistente-bancario-v2"
version = "2.0.0"
description = "Assistente Bancário V2 — chat web com 7 agentes Agno, OTP por e-mail e Step-Up 2FA"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["assistente_bancario_v2", "frontend"]
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM",
]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["assistente_bancario_v2"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["data/", "tests/", ".venv/"]

[[tool.mypy.overrides]]
module = ["agno.*", "slowapi.*", "streamlit.*", "websocket.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "assistente_bancario_v2/bot_service/app/tests",
    "assistente_bancario_v2/banking_gateway/app/tests",
    "tests",
]
norecursedirs = ["__pycache__", ".git", "data", ".venv"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
